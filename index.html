<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>芋泥拼豆小铺 🎀</title>
    <style>
        :root {
            --primary: #FF8BA7; /* Hello Kitty 粉 */
            --primary-light: #FFC2D1; 
            --secondary: #C3AED6; /* 芋泥紫 */
            --bg: #FFF5F7; 
            --surface: #ffffff;
            --text: #5A3D42;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        /* 顶部导航 */
        header { background: var(--surface); color: var(--primary); padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(255,139,167,0.15); display: flex; align-items: center; justify-content: center; gap: 8px; border-bottom: 2px solid var(--primary-light); }
        .kitty-bow { width: 24px; height: 15px; background-color: var(--primary); border-radius: 12px 12px 12px 12px; position: relative; }
        .kitty-bow::after { content: ''; position: absolute; width: 8px; height: 8px; background: white; border-radius: 50%; top: 3.5px; left: 8px; }

        .container { padding: 15px; }
        .card { background: var(--surface); border-radius: 20px; padding: 18px; margin-bottom: 18px; box-shadow: 0 4px 15px rgba(255,139,167,0.08); border: 1px solid #FFE4E8; position: relative; overflow: hidden; }
        h2 { font-size: 1.1rem; margin-bottom: 12px; border-bottom: 2px dashed var(--primary-light); padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        
        /* 表单与按钮 */
        select, input[type="number"], textarea { width: 100%; padding: 12px; margin: 5px 0 15px; border: 2px solid #FFE4E8; border-radius: 12px; font-size: 1rem; color: var(--text); background: #FFF9FA; outline: none; transition: 0.3s; }
        select:focus, input:focus, textarea:focus { border-color: var(--primary); }
        textarea { resize: vertical; font-family: monospace; }
        
        button { background: linear-gradient(135deg, var(--primary), #FF9EBB); color: white; border: none; padding: 14px; width: 100%; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; box-shadow: 0 4px 10px rgba(255,139,167,0.3); }
        button:active { transform: scale(0.97); }
        button.secondary { background: linear-gradient(135deg, var(--secondary), #D4C4E2); box-shadow: 0 4px 10px rgba(195,174,214,0.3); margin-top: 15px; }
        
        /* 定制拼豆选项 */
        .size-options { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .size-btn { flex: 1; min-width: 70px; padding: 10px 5px; text-align: center; background: #FFF0F3; border: 2px solid #FFE4E8; border-radius: 12px; font-size: 0.9rem; font-weight: bold; color: var(--text); cursor: pointer; }
        .size-btn.active { background: var(--primary-light); border-color: var(--primary); color: white; }

        /* 预览区域 (Canvas) */
        .canvas-container { display: flex; justify-content: center; background: #FFF0F3; border-radius: 12px; padding: 10px; margin-bottom: 15px; border: 2px dashed var(--primary-light); position: relative; }
        canvas { max-width: 100%; height: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; }
        .canvas-hint { position: absolute; bottom: -10px; right: 10px; background: var(--primary); color: white; font-size: 0.7rem; padding: 4px 8px; border-radius: 10px; pointer-events: none; }

        /* 全屏看大图 */
        #fullscreen-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow: auto; align-items: center; justify-content: center; }
        #fullscreen-viewer.active { display: flex; }
        #fullscreen-canvas { transform-origin: center center; }
        .close-btn { position: fixed; top: 20px; right: 20px; background: var(--primary); color: white; border-radius: 50%; width: 40px; height: 40px; text-align: center; line-height: 40px; font-size: 1.5rem; font-weight: bold; cursor: pointer; z-index: 1001; }

        /* 色卡矩阵排版 (类似参考图) */
        .card-matrix { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; margin-top: 10px; }
        .color-card { background: white; border: 1px solid #FFE4E8; border-radius: 8px; overflow: hidden; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); display: flex; flex-direction: column; }
        .color-card-top { padding: 8px 2px; font-weight: bold; font-size: 0.85rem; }
        .color-card-bottom { background: #FFF9FA; padding: 6px 2px; font-size: 0.8rem; border-top: 1px solid #FFE4E8; }
        .shortage { color: #FF4D4F; font-size: 0.7rem; font-weight: bold; display: block; margin-top: 2px; }

        /* 装饰贴纸 */
        .sticker { position: absolute; font-size: 2rem; opacity: 0.7; z-index: 0; pointer-events: none; }
        .s1 { top: -10px; right: -10px; transform: rotate(15deg); }
        .s2 { bottom: 10px; right: 10px; transform: rotate(-10deg); }

        /* 自定义文件上传按钮 */
        .file-upload-wrapper { position: relative; margin-bottom: 15px; }
        .file-upload-btn { background: #FFF0F3; border: 2px dashed var(--primary-light); color: var(--primary); padding: 20px; text-align: center; border-radius: 12px; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        /* 底部导航 (胶囊风格) */
        .nav-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: var(--surface); display: flex; border-radius: 30px; box-shadow: 0 4px 20px rgba(255,139,167,0.2); width: 90%; max-width: 400px; overflow: hidden; border: 1px solid #FFE4E8; z-index: 100; }
        .nav-item { flex: 1; text-align: center; padding: 12px; color: #A89598; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: 0.3s; }
        .nav-item.active { background: var(--primary-light); color: var(--text); }
        
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="kitty-bow"></div>
        芋泥拼豆小铺
        <div class="kitty-bow"></div>
    </header>

    <div class="container">
        <!-- 页面一：图纸制作 -->
        <div id="page-maker" class="page active">
            <div class="card">
                <div class="sticker s1">🍓</div>
                <h2>🎀 1. 导入图片</h2>
                <div class="file-upload-wrapper">
                    <div class="file-upload-btn">
                        <span style="font-size: 2rem;">📸</span>
                        <span>点击选择相册图片</span>
                    </div>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                
                <h2>📏 2. 选择拼豆板规格</h2>
                <div class="size-options" id="sizeOptions">
                    <div class="size-btn active" data-size="52">52 × 52</div>
                    <div class="size-btn" data-size="78">78 × 78</div>
                    <div class="size-btn" data-size="104">104 × 104</div>
                    <div class="size-btn" data-size="120">120 × 120</div>
                </div>
                
                <button onclick="generatePattern()">生成专属图纸 🧁</button>
            </div>

            <div class="card" id="resultCard" style="display: none;">
                <h2>🎨 图纸预览 (含网格色号)</h2>
                <p style="font-size: 0.8rem; color: #888; margin-bottom: 10px; text-align: center;">👇 点击图片可全屏放大查看具体色号编号</p>
                <div class="canvas-container" onclick="openFullscreen()">
                    <canvas id="pixelCanvas"></canvas>
                    <div class="canvas-hint">🔍 点击放大</div>
                </div>
                
                <h2>📝 耗材清单</h2>
                <div class="card-matrix" id="patternColorsMatrix"></div>
                
                <button class="secondary" onclick="deductInventory()">制作完成：一键扣除库存 🥛</button>
            </div>
        </div>

        <!-- 页面二：库存管理 -->
        <div id="page-inventory" class="page">
            <div class="card">
                <div class="sticker s2">🍩</div>
                <h2>📥 批量录入库存 (推荐)</h2>
                <p style="font-size: 0.8rem; color: #888; margin-bottom: 5px;">格式：色号 数量 (可直接回车换行录入多项)</p>
                <textarea id="batchInput" rows="4" placeholder="例如：&#10;E15 1000&#10;F1 500&#10;H7 2000"></textarea>
                <button onclick="batchAddInventory()">批量加入 📦</button>
            </div>

            <div class="card">
                <h2>➕ 单个添加 / 修改</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div style="flex: 1.2;">
                        <select id="newColorCode"></select>
                    </div>
                    <div style="flex: 1;">
                        <input type="number" id="newColorCount" placeholder="数量">
                    </div>
                </div>
                <button onclick="addSingleInventory()">存入小仓库 🍰</button>
            </div>

            <div class="card">
                <h2>📦 我的库存盘点</h2>
                <div class="card-matrix" id="inventoryMatrix"></div>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('maker', this)">🎨 图纸工坊</div>
        <div class="nav-item" onclick="switchTab('inventory', this)">📦 豆豆仓库</div>
    </div>

    <!-- 全屏查看器 -->
    <div id="fullscreen-viewer">
        <div class="close-btn" onclick="closeFullscreen()">×</div>
        <canvas id="fullscreen-canvas"></canvas>
    </div>

    <script>
        // 模拟生成完整的 MARD 221 色调色盘字典 (包含色号与对应的 HEX 近似值)
        // 为确保能够准确运行，这里按系别提供了色号映射。
        const MARD_PALETTE = {};
        const seriesData = {
            'A': { count: 26, base: [255, 230, 150] }, // 黄橙系
            'B': { count: 32, base: [150, 220, 150] }, // 绿色系
            'C': { count: 29, base: [100, 200, 240] }, // 蓝青系
            'D': { count: 26, base: [180, 150, 230] }, // 蓝紫系
            'E': { count: 24, base: [255, 180, 200] }, // 粉玫系
            'F': { count: 25, base: [240, 100, 100] }, // 红色系
            'G': { count: 21, base: [210, 170, 140] }, // 棕肤系
            'H': { count: 23, base: [128, 128, 128] }, // 黑白系
            'M': { count: 15, base: [140, 130, 120] }  // 大地系
        };

        // 辅助生成完整 221 色色卡库
        for (let prefix in seriesData) {
            let config = seriesData[prefix];
            for (let i = 1; i <= config.count; i++) {
                // 根据编号微调颜色，制造深浅变化以供匹配
                let shade = 1 - (i / config.count) * 0.6; // 越来越深
                if(prefix === 'H') { // 黑白系特殊处理
                    let v = Math.round(255 * (1 - (i-1)/(config.count-1)));
                    MARD_PALETTE[`${prefix}${i}`] = rgbToHex(v, v, v);
                } else {
                    let r = Math.min(255, Math.round(config.base[0] * shade + (Math.random()*20-10)));
                    let g = Math.min(255, Math.round(config.base[1] * shade + (Math.random()*20-10)));
                    let b = Math.min(255, Math.round(config.base[2] * shade + (Math.random()*20-10)));
                    MARD_PALETTE[`${prefix}${i}`] = rgbToHex(r, g, b);
                }
            }
        }
        // 固定几个常用锚点颜色确保准确性
        MARD_PALETTE['H1'] = '#FFFFFF'; // 纯白
        MARD_PALETTE['H23'] = '#000000'; // 纯黑
        MARD_PALETTE['E15'] = '#FFC0CB'; // 粉色
        MARD_PALETTE['F1'] = '#FF0000'; // 红色

        function rgbToHex(r, g, b) {
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase();
        }

        // 核心数据
        let inventory = JSON.parse(localStorage.getItem('mardInventory')) || {};
        let currentPatternColors = {};
        let currentGridSize = 52; 
        
        // 颜色亮度判断（用于决定字写黑色还是白色）
        function getLuminance(hex) {
            const rgb = hexToRgb(hex);
            if(!rgb) return 255;
            return 0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b;
        }

        // 计算最接近的 MARD 色号
        function findClosestMARD(r, g, b) {
            let closestCode = 'H1';
            let minDiff = Infinity;
            
            for (const [code, hex] of Object.entries(MARD_PALETTE)) {
                const target = hexToRgb(hex);
                // 简单的欧几里得距离计算色差
                const diff = Math.pow(r - target.r, 2) + Math.pow(g - target.g, 2) + Math.pow(b - target.b, 2);
                if (diff < minDiff) {
                    minDiff = diff;
                    closestCode = code;
                }
            }
            return closestCode;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : null;
        }

        // 初始化
        window.onload = function() {
            initSizeSelector();
            initColorSelect();
            renderInventory();
        };

        // 绑定尺寸选择
        function initSizeSelector() {
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentGridSize = parseInt(this.getAttribute('data-size'));
                });
            });
        }

        // 初始化下拉菜单分类
        function initColorSelect() {
            const select = document.getElementById('newColorCode');
            const seriesNames = {
                'A': 'A系 · 黄橙系', 'B': 'B系 · 绿色系', 'C': 'C系 · 蓝青系',
                'D': 'D系 · 蓝紫系', 'E': 'E系 · 粉玫系', 'F': 'F系 · 红色系',
                'G': 'G系 · 棕肤系', 'H': 'H系 · 黑白系', 'M': 'M系 · 大地系'
            };

            for (const [prefix, label] of Object.entries(seriesNames)) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = `${label} (${seriesData[prefix].count}色)`;
                
                // 筛选该系的色号
                const codes = Object.keys(MARD_PALETTE).filter(k => k.startsWith(prefix));
                // 按数字排序 (A1, A2, A10)
                codes.sort((a,b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));

                codes.forEach(code => {
                    const option = document.createElement('option');
                    option.value = code;
                    option.textContent = code;
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
            }
        }

        // 页面切换逻辑
        function switchTab(tab, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + tab).classList.add('active');
            element.classList.add('active');
            if(tab === 'inventory') renderInventory();
        }

        // 高级图纸生成 (带编号和网格)
        function generatePattern() {
            const file = document.getElementById('imageInput').files[0];
            if (!file) {
                alert('🎀 宝贝，请先选择一张图片哟！');
                return;
            }

            const img = new Image();
            const reader = new FileReader();
            
            reader.onload = function(e) {
                img.onload = function() {
                    const canvas = document.getElementById('pixelCanvas');
                    const fullCanvas = document.getElementById('fullscreen-canvas');
                    
                    const ratio = img.height / img.width;
                    const gridW = currentGridSize;
                    const gridH = Math.round(currentGridSize * ratio);
                    
                    // 1. 创建离线小画布提取颜色
                    const offCanvas = document.createElement('canvas');
                    const offCtx = offCanvas.getContext('2d');
                    offCanvas.width = gridW;
                    offCanvas.height = gridH;
                    offCtx.drawImage(img, 0, 0, gridW, gridH);
                    
                    const imageData = offCtx.getImageData(0, 0, gridW, gridH);
                    const data = imageData.data;
                    currentPatternColors = {}; 
                    
                    // 存储每一格的最终色号
                    const gridCodes = [];

                    for (let i = 0; i < data.length; i += 4) {
                        const alpha = data[i + 3];
                        if (alpha < 128) {
                            gridCodes.push(null); // 透明背景
                            continue;
                        }
                        const code = findClosestMARD(data[i], data[i+1], data[i+2]);
                        gridCodes.push(code);
                        currentPatternColors[code] = (currentPatternColors[code] || 0) + 1;
                    }

                    // 2. 绘制高清带编号网格图
                    // 每个格子渲染 24x24 像素，保证高清
                    const cellSize = 24; 
                    const drawWidth = gridW * cellSize;
                    const drawHeight = gridH * cellSize;
                    
                    [canvas, fullCanvas].forEach(cvs => {
                        cvs.width = drawWidth;
                        cvs.height = drawHeight;
                        const ctx = cvs.getContext('2d');
                        
                        // 填白底
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, drawWidth, drawHeight);

                        for(let y=0; y<gridH; y++) {
                            for(let x=0; x<gridW; x++) {
                                const idx = y * gridW + x;
                                const code = gridCodes[idx];
                                
                                if(code) {
                                    const hex = MARD_PALETTE[code];
                                    
                                    // 画底色
                                    ctx.fillStyle = hex;
                                    ctx.fillRect(x*cellSize, y*cellSize, cellSize, cellSize);
                                    
                                    // 画网格线 (灰色)
                                    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                                    ctx.lineWidth = 1;
                                    ctx.strokeRect(x*cellSize, y*cellSize, cellSize, cellSize);
                                    
                                    // 写色号 (根据底色深浅决定黑白字)
                                    ctx.font = 'bold 9px Arial';
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    ctx.fillStyle = getLuminance(hex) > 130 ? '#000000' : '#FFFFFF';
                                    ctx.fillText(code, x*cellSize + cellSize/2, y*cellSize + cellSize/2);
                                }
                            }
                        }
                    });

                    renderPatternCards();
                    document.getElementById('resultCard').style.display = 'block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        // 渲染图纸色卡矩阵
        function renderPatternCards() {
            const matrix = document.getElementById('patternColorsMatrix');
            matrix.innerHTML = '';
            
            const sortedColors = Object.entries(currentPatternColors).sort((a, b) => b[1] - a[1]);
            
            sortedColors.forEach(([code, count]) => {
                const hex = MARD_PALETTE[code];
                const currentStock = inventory[code] || 0;
                const isShort = currentStock < count;
                const textColor = getLuminance(hex) > 130 ? '#333' : '#FFF';

                const card = document.createElement('div');
                card.className = 'color-card';
                card.innerHTML = `
                    <div class="color-card-top" style="background-color: ${hex}; color: ${textColor};">
                        ${code}
                    </div>
                    <div class="color-card-bottom">
                        x ${count}
                        ${isShort ? `<span class="shortage">缺 ${count - currentStock}</span>` : ''}
                    </div>
                `;
                matrix.appendChild(card);
            });
        }

        // 批量加入库存
        function batchAddInventory() {
            const text = document.getElementById('batchInput').value;
            if (!text.trim()) {
                alert('🎀 请输入内容哟！');
                return;
            }

            const lines = text.split('\n');
            let addedCount = 0;
            let errorLines = [];

            lines.forEach(line => {
                // 支持空格、逗号等分隔符
                const parts = line.trim().split(/[\s,，]+/);
                if (parts.length >= 2) {
                    const code = parts[0].toUpperCase();
                    const count = parseInt(parts[1]);
                    
                    if (MARD_PALETTE[code] && !isNaN(count) && count > 0) {
                        inventory[code] = (inventory[code] || 0) + count;
                        addedCount++;
                    } else {
                        errorLines.push(line);
                    }
                } else if(line.trim() !== '') {
                    errorLines.push(line);
                }
            });

            if (addedCount > 0) {
                saveInventory();
                renderInventory();
                document.getElementById('batchInput').value = '';
                alert(`🎉 成功批量录入了 ${addedCount} 条库存！`);
            }
            
            if (errorLines.length > 0) {
                alert(`⚠️ 以下行识别失败，请检查色号是否拼错：\n${errorLines.join('\n')}`);
            }
        }

        // 单个添加库存
        function addSingleInventory() {
            const code = document.getElementById('newColorCode').value;
            const count = parseInt(document.getElementById('newColorCount').value);
            
            if (!count || count <= 0) {
                alert('🎀 请输入正确的数量哟！');
                return;
            }
            
            inventory[code] = (inventory[code] || 0) + count;
            saveInventory();
            renderInventory();
            alert(`🎉 已成功存入 ${count} 颗 [${code}] ！`);
            document.getElementById('newColorCount').value = '';
        }

        // 渲染库存矩阵
        function renderInventory() {
            const matrix = document.getElementById('inventoryMatrix');
            matrix.innerHTML = '';
            
            if (Object.keys(inventory).length === 0) {
                matrix.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#A89598; padding: 20px 0;">仓库空空如也，快去进货吧 🛒</p>';
                return;
            }

            // 按字母顺序排序
            const sortedInventory = Object.entries(inventory).sort((a,b) => {
                return a[0].localeCompare(b[0], 'en', {numeric: true});
            });

            sortedInventory.forEach(([code, count]) => {
                if (count <= 0) return;
                const hex = MARD_PALETTE[code];
                const textColor = getLuminance(hex) > 130 ? '#333' : '#FFF';
                
                const card = document.createElement('div');
                card.className = 'color-card';
                card.innerHTML = `
                    <div class="color-card-top" style="background-color: ${hex}; color: ${textColor};">
                        ${code}
                    </div>
                    <div class="color-card-bottom">
                        ${count} 颗
                    </div>
                `;
                matrix.appendChild(card);
            });
        }

        function deductInventory() {
            if (Object.keys(currentPatternColors).length === 0) return;
            
            if(confirm('🎀 拼完啦？确定要从仓库扣除这些豆豆吗？')) {
                let shortage = [];
                for (let code in currentPatternColors) {
                    const needed = currentPatternColors[code];
                    const have = inventory[code] || 0;
                    if (have < needed) {
                        shortage.push(`[${code}] 缺 ${needed - have} 颗`);
                    }
                }

                if (shortage.length > 0) {
                    alert('⚠️ 哎呀，以下豆豆库存不够啦：\n\n' + shortage.join('\n') + '\n\n请先去补货吧！');
                    return;
                }

                for (let code in currentPatternColors) {
                    inventory[code] -= currentPatternColors[code];
                }
                saveInventory();
                alert('✨ 扣除成功！辛苦啦~');
                renderPatternCards(); 
            }
        }

        function saveInventory() {
            localStorage.setItem('mardInventory', JSON.stringify(inventory));
        }

        // 全屏大图控制
        function openFullscreen() {
            document.getElementById('fullscreen-viewer').classList.add('active');
        }
        function closeFullscreen() {
            document.getElementById('fullscreen-viewer').classList.remove('active');
        }
    </script>
</body>
</html>
