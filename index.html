<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>芋泥拼豆小铺 🎀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');

        :root {
            --hk-pink: #FFB6C1;
            --hk-hotpink: #FF69B4;
            --taro-purple: #E6E6FA;
            --taro-dark: #B39DDB;
            --hk-bg: #FFF5F7;
        }

        body {
            background-color: var(--hk-bg);
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-image: radial-gradient(#FFD1DC 2px, transparent 2px);
            background-size: 30px 30px;
            user-select: none;
        }
        
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: rgba(255, 245, 247, 0.95);
            backdrop-filter: blur(10px);
            position: relative;
            box-shadow: 0 0 30px rgba(255, 182, 193, 0.2);
            overflow-x: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #FFF0F3; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #FFB6C1; border-radius: 10px; }

        .sticker {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 1.8rem;
            box-shadow: 0 6px 16px rgba(255, 182, 193, 0.4);
            border: 3px solid var(--taro-purple);
            position: absolute;
            z-index: 10;
        }
        .sticker-tr { top: -15px; right: -10px; transform: rotate(15deg); }
        .sticker-tl { top: -15px; left: -10px; transform: rotate(-15deg); }

        .card-pink {
            background: white;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(255, 182, 193, 0.15);
            border: 2px solid var(--hk-pink);
            position: relative;
            margin-bottom: 24px;
        }

        .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 8px; max-height: 250px; overflow-y: auto; padding: 10px; background: #FFF0F3; border-radius: 16px; border: 2px dashed #FFC2D1; margin-bottom: 15px; }
        .palette-item { width: 100%; aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; cursor: pointer; transition: 0.2s; border: 2px solid transparent; position: relative; }
        .palette-item.selected { transform: scale(1.1); border-color: var(--hk-hotpink); box-shadow: 0 0 10px rgba(255,105,180,0.6); z-index: 2; }
        .palette-item.selected::after { content: '✓'; position: absolute; top: -5px; right: -5px; background: var(--hk-hotpink); color: white; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; }

        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 10px; }
        .inventory-card { background: white; border: 1px solid #FFE4E8; border-radius: 12px; overflow: hidden; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.1s; }
        .inventory-card:active { transform: scale(0.95); }
        .inventory-card-top { padding: 8px 2px; font-weight: 900; font-size: 0.85rem; }
        .inventory-card-bottom { background: #FFF9FA; padding: 6px 2px; font-size: 0.8rem; border-top: 1px solid #FFE4E8; font-weight: 800; color: #5A3D42; }
        
        .loader { border: 4px solid #FFF5F7; border-top: 4px solid #FF69B4; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Toast Notification */
        .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(255,255,255,0.95); color: var(--hk-hotpink); padding: 12px 24px; border-radius: 30px; font-weight: 900; font-size: 0.95rem; box-shadow: 0 10px 25px rgba(255,105,180,0.2); border: 2px solid var(--hk-pink); opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 9999; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body class="text-gray-700">

    <div class="app-container pb-28">
        
        <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md pt-safe px-4 py-3 flex items-center justify-center shadow-sm border-b border-pink-100/50">
            <h1 class="text-lg font-extrabold text-pink-500 flex items-center justify-center gap-2 tracking-wide">
                <span class="text-2xl">🐱</span> 芋泥拼豆小铺 <span class="text-2xl">🎀</span>
            </h1>
        </header>

        <main class="p-4">
            <section id="tab-maker" class="block animate-fade-in">
                
                <!-- 1. 定制拼豆图纸 (Custom Pattern) -->
                <div class="card-pink mt-2">
                    <div class="sticker sticker-tr">📸</div>
                    <h2 class="text-lg font-extrabold text-gray-800 mb-2 flex items-center gap-2">
                        定制拼豆图纸
                    </h2>
                    <p class="text-xs text-pink-400 font-bold mb-4">上传任意图片，系统会自动帮你转换成带色号的高清拼豆网格图纸哟！</p>
                    
                    <div class="mb-4">
                        <div class="relative w-full h-14 rounded-2xl bg-pink-50/50 flex items-center px-4 overflow-hidden border-2 border-dashed border-pink-200 hover:bg-pink-50 transition-colors">
                            <div class="bg-white p-1 rounded-lg shadow-sm mr-3"><i class="ph-fill ph-image text-pink-400 text-lg"></i></div>
                            <span id="fileName-custom" class="text-pink-300 text-sm font-bold truncate flex-1">点击选择图片...</span>
                            <input type="file" id="imageInput-custom" accept="image/*" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer" onchange="updateFileName('custom')">
                        </div>
                    </div>

                    <div class="mb-5">
                        <div class="relative flex items-center bg-pink-50/50 rounded-2xl overflow-hidden border-2 border-pink-100">
                            <div class="absolute left-3 bg-white p-1 rounded-lg shadow-sm"><i class="ph-fill ph-squares-four text-purple-400 text-lg"></i></div>
                            <select id="gridSize-custom" class="w-full bg-transparent py-3 pl-12 pr-8 text-gray-700 font-extrabold appearance-none focus:outline-none">
                                <option value="52">52 × 52 格 (小巧)</option>
                                <option value="78">78 × 78 格 (常规)</option>
                                <option value="104">104 × 104 格 (大幅)</option>
                                <option value="120">120 × 120 格 (巨幅)</option>
                            </select>
                            <i class="ph-bold ph-caret-down text-pink-300 absolute right-3 pointer-events-none"></i>
                        </div>
                    </div>

                    <button onclick="processImage('custom')" class="w-full bg-[#FFB6C1] hover:bg-[#FF69B4] text-white font-black py-3.5 rounded-2xl shadow-[0_4px_15px_rgba(255,182,193,0.5)] active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                        <i class="ph-bold ph-magic-wand"></i> 生成高清图纸 ✨
                    </button>
                </div>

                <!-- Custom Pattern Result -->
                <div id="result-custom" class="hidden card-pink mt-4">
                    <h2 class="text-base font-extrabold text-gray-800 mb-3 flex items-center gap-2 border-b-2 border-pink-50 pb-3">
                        <span class="bg-pink-100 p-1 rounded-full text-pink-500"><i class="ph-fill ph-palette"></i></span> 图纸与消耗清单
                    </h2>
                    
                    <div class="mb-2 text-center text-xs font-bold text-pink-400">点击图纸可全屏放大查看编号 👇</div>
                    <div onclick="openViewer()" class="w-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-gray-100 rounded-2xl p-2 mb-4 flex justify-center border-4 border-pink-100 shadow-inner overflow-hidden relative cursor-pointer group">
                        <img id="previewImage-custom" class="w-full max-w-[280px] h-auto shadow-md rounded-md" alt="拼豆图纸预览">
                    </div>
                    
                    <div id="req-list-custom" class="inventory-grid mb-4 max-h-[30vh] overflow-y-auto custom-scrollbar p-1"></div>

                    <button onclick="deductFromInventory('custom')" class="w-full bg-white text-pink-500 hover:bg-pink-50 font-black py-3 rounded-2xl shadow-sm active:scale-[0.98] transition-transform border-2 border-[#FFB6C1] flex justify-center items-center gap-2">
                        <i class="ph-bold ph-check-fat"></i> 图纸完成 (一键扣除库存)
                    </button>
                </div>

                <!-- 2. 拼豆成品图纸 (Finished Pattern Fast Deduct) -->
                <div class="card-pink mt-6">
                    <div class="sticker sticker-tl">⚡</div>
                    <h2 class="text-lg font-extrabold text-gray-800 mb-2 flex items-center gap-2">
                        拼豆成品图纸
                    </h2>
                    <p class="text-xs text-purple-400 font-bold mb-4">直接上传数字成品设计图，跳过网格预览，一键极速计算并扣除所需豆子！</p>
                    
                    <div class="mb-4">
                        <div class="relative w-full h-14 rounded-2xl bg-purple-50/50 flex items-center px-4 overflow-hidden border-2 border-dashed border-purple-200 hover:bg-purple-50 transition-colors">
                            <div class="bg-white p-1 rounded-lg shadow-sm mr-3"><i class="ph-fill ph-lightning text-purple-400 text-lg"></i></div>
                            <span id="fileName-finished" class="text-purple-400 text-sm font-bold truncate flex-1">点击上传成品设计图...</span>
                            <input type="file" id="imageInput-finished" accept="image/*" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer" onchange="updateFileName('finished')">
                        </div>
                    </div>

                    <div class="mb-5 flex gap-2">
                         <select id="gridSize-finished" class="flex-1 bg-purple-50/50 py-3 px-4 border-2 border-purple-100 rounded-2xl text-gray-700 font-extrabold focus:outline-none">
                            <option value="52">52格</option>
                            <option value="78">78格</option>
                            <option value="104">104格</option>
                            <option value="120">120格</option>
                        </select>
                        <button onclick="processImage('finished')" class="flex-[2] bg-gradient-to-r from-[#B39DDB] to-[#9FA8DA] text-white font-black py-3 rounded-2xl shadow-md active:scale-[0.98] transition-all">
                            极速计算用量 🚀
                        </button>
                    </div>
                </div>

                <!-- Finished Pattern Result -->
                <div id="result-finished" class="hidden card-pink mt-4 bg-purple-50/30 border-purple-200">
                    <h2 class="text-base font-extrabold text-gray-800 mb-3 flex items-center gap-2 border-b-2 border-purple-100 pb-3">
                        <span class="bg-purple-100 p-1 rounded-full text-purple-500"><i class="ph-fill ph-calculator"></i></span> 成品消耗清单
                    </h2>
                    <div id="req-list-finished" class="inventory-grid mb-4 max-h-[30vh] overflow-y-auto custom-scrollbar p-1"></div>
                    <button onclick="deductFromInventory('finished')" class="w-full bg-purple-500 text-white font-black py-3 rounded-2xl shadow-md active:scale-[0.98] transition-transform flex justify-center items-center gap-2">
                        <i class="ph-bold ph-check-fat"></i> 一键扣除库存
                    </button>
                </div>

                <!-- Low Inventory Alert -->
                <div id="low-inventory-alert" class="hidden card-pink mt-6 !border-red-300 !bg-red-50/50 !shadow-[0_4px_15px_rgba(255,0,0,0.1)]">
                    <div class="sticker sticker-tr !border-red-300 !text-red-500 !text-3xl">🚨</div>
                    <h2 class="text-lg font-extrabold text-red-500 mb-3 flex items-center gap-2">
                        <i class="ph-fill ph-warning-circle"></i> 库存告急提醒
                    </h2>
                    <p class="text-xs text-red-400 font-bold mb-3">以下颜色的豆子存量已不足 200 颗，请及时补货哦！</p>
                    <div id="low-inventory-list" class="inventory-grid max-h-[25vh] overflow-y-auto custom-scrollbar p-1"></div>
                </div>

                <!-- Hidden canvas for processing high res image -->
                <canvas id="hiddenCanvas" class="hidden"></canvas>
            </section>

            <section id="tab-inventory" class="hidden animate-fade-in mt-2">
                <div class="flex justify-between items-end mb-4 px-1">
                    <h2 class="text-2xl font-black text-gray-800 tracking-wide flex items-center gap-2">
                        <i class="ph-fill ph-treasure-chest text-pink-400"></i> 我的仓库
                    </h2>
                    <button onclick="undoAction()" class="bg-white border-2 border-pink-200 text-pink-500 px-4 py-2 rounded-full font-bold text-sm shadow-sm hover:bg-pink-50 active:scale-95 transition-all flex items-center gap-1">
                        <i class="ph-bold ph-arrow-u-up-left"></i> 撤回上一步
                    </button>
                </div>

                <div class="card-pink">
                    <h3 class="text-sm font-extrabold text-gray-800 mb-3 flex items-center gap-2 border-b-2 border-pink-50 pb-2">
                        <i class="ph-fill ph-package text-pink-400"></i> 批量录入色号
                    </h3>
                    <div class="palette-grid custom-scrollbar" id="addPaletteGrid"></div>
                    
                    <div class="flex items-center gap-3 mt-4">
                        <span class="text-xs font-bold text-white bg-pink-400 px-3 py-1.5 rounded-lg whitespace-nowrap" id="selectedCountDisplay">已选 0 色</span>
                        <input type="number" id="batchCountInput" placeholder="输入统一数量..." class="flex-1 bg-pink-50 border-2 border-pink-100 rounded-xl px-3 py-2 font-bold text-sm outline-none focus:border-pink-400">
                        <button onclick="commitBatchAdd()" class="bg-pink-500 text-white font-black px-5 py-2.5 rounded-xl shadow-md active:scale-95 transition-all">
                            存入 🍰
                        </button>
                    </div>
                </div>

                <div class="card-pink mt-6">
                    <div class="flex justify-between items-center mb-3 border-b-2 border-pink-50 pb-2">
                        <h3 class="text-sm font-extrabold text-gray-800 flex items-center gap-2">
                            <i class="ph-fill ph-list-dashes text-purple-400"></i> 库存盘点
                        </h3>
                        <span id="totalColorsCount" class="text-[10px] font-bold text-purple-500 bg-purple-100 px-2 py-1 rounded-md">共 0 色</span>
                    </div>
                    <p class="text-[10px] text-center text-pink-400 font-bold mb-3">💡 点击下方卡片可修改数量，设为 0 即可删除</p>
                    <div id="inventoryMatrix" class="inventory-grid max-h-[45vh] overflow-y-auto custom-scrollbar p-1"></div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 w-full max-w-[500px] bg-white/95 backdrop-blur-md rounded-t-3xl shadow-[0_-4px_25px_rgba(255,182,193,0.2)] pb-safe pt-2 px-8 flex justify-around z-40 border-t border-pink-50">
            <button onclick="switchTab('maker')" id="nav-maker" class="nav-btn active flex flex-col items-center p-2.5 text-pink-500 transition-colors">
                <i class="ph-fill ph-sparkle text-2xl mb-1"></i>
                <span class="text-[11px] font-black">图纸工坊</span>
            </button>
            <button onclick="switchTab('inventory')" id="nav-inventory" class="nav-btn flex flex-col items-center p-2.5 text-pink-200 transition-colors hover:text-pink-400">
                <i class="ph-fill ph-backpack text-2xl mb-1"></i>
                <span class="text-[11px] font-black">豆豆仓库</span>
            </button>
        </nav>
    </div>

    <!-- Image Viewer -->
    <div id="imageViewer" class="fixed inset-0 bg-gray-900/95 backdrop-blur-md z-50 hidden flex-col transition-opacity duration-300 opacity-0">
        <div class="pt-10 px-4 pb-2 flex justify-between items-center text-white bg-black/30 shadow-sm border-b border-white/10 shrink-0">
            <div class="flex items-center gap-2 font-bold text-sm text-pink-200"><i class="ph-bold ph-arrows-out"></i> 滑动与缩放查看高清色号</div>
            <button onclick="closeViewer()" class="bg-white/20 hover:bg-pink-500 text-white rounded-full p-2 w-10 h-10 flex items-center justify-center transition-colors"><i class="ph-bold ph-x text-lg"></i></button>
        </div>
        <div class="pan-zoom-container bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-gray-800">
            <img id="viewerImage" src="" class="max-w-none shadow-2xl bg-white" alt="高清图纸">
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="customModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl w-full max-w-xs p-6 shadow-2xl transform scale-95 transition-transform duration-300 border-4 border-white relative text-center" id="modalContent">
            <div class="absolute -top-8 left-1/2 transform -translate-x-1/2 sticker" id="modalSticker" style="width:50px; height:50px; font-size:1.5rem;">🍓</div>
            <div class="mt-4 mb-3 inline-flex items-center justify-center w-14 h-14 rounded-full bg-pink-50 border-4 border-white shadow-sm" id="modalIcon">
                <i class="ph-fill ph-cat text-2xl text-pink-400"></i>
            </div>
            <h3 class="text-lg font-black text-gray-800 mb-2" id="modalTitle">提示</h3>
            <p class="text-gray-500 font-bold text-sm mb-5 leading-relaxed" id="modalMessage">消息</p>
            <div id="modalInputContainer" class="hidden mb-5">
                <input type="number" id="modalInput" class="w-full bg-pink-50 border-2 border-pink-100 rounded-xl p-3 font-bold text-center text-gray-700 outline-none focus:border-pink-400">
            </div>
            <div class="flex gap-2" id="modalActions"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">消息提示</div>

            "E1": "#FDD3CC", "E2": "#FEC0DF", "E3": "#FFB7E7", "E4": "#E8649E", "E5": "#F551A2", "E6": "#F13D74", "E7": "#C63478", "E8": "#FFDBE9", "E9": "#E970CC", "E10": "#D33793", "E11": "#FCDDD2", "E12": "#F78FC3", "E13": "#B5006D", "E14": "#FFD1BA", "E15": "#F8C7C9", "E16": "#FFF3EB", "E17": "#FFE2EA", "E18": "#FFC7DB", "E19": "#FEBAD5", "E20": "#D8C7D1", "E21": "#BD9DA1", "E22": "#B785A1", "E23": "#937A8D", "E24": "#E1BCE8",
            "F1": "#FD957B", "F2": "#FC3D46", "F3": "#F74941", "F4": "#FC283C", "F5": "#E7002F", "F6": "#943630", "F7": "#971937", "F8": "#BC0028", "F9": "#E2677A", "F10": "#8A4526", "F11": "#5A2121", "F12": "#FD4E6A", "F13": "#F35744", "F14": "#FFA0AD", "F15": "#D30022", "F16": "#FEC2A6", "F17": "#E69C79", "F18": "#D37C46", "F19": "#C1444A", "F20": "#CD9391", "F21": "#F7B4C6", "F22": "#FDC0D0", "F23": "#F67E66", "F24": "#E698AA", "F25": "#E54B4F",
            "G1": "#FFE2CE", "G2": "#FFC4AA", "G3": "#F4C3A5", "G4": "#E1B383", "G5": "#EDB045", "G6": "#E99C17", "G7": "#9D5B3E", "G8": "#753832", "G9": "#E6B483", "G10": "#D98C39", "G11": "#E0C593", "G12": "#FFC890", "G13": "#B7714A", "G14": "#8D614C", "G15": "#FCF9E0", "G16": "#F2D9BA", "G17": "#78524B", "G18": "#FFE4CC", "G19": "#E07935", "G20": "#A94023", "G21": "#B8855B",
            "H1": "#FDFBFF", "H2": "#FEFFFF", "H3": "#B6B1BA", "H4": "#89858C", "H5": "#48464E", "H6": "#2F2B2F", "H7": "#000000", "H8": "#E7D6DB", "H9": "#EDEDED", "H10": "#EEE9EA", "H11": "#CECDD5", "H12": "#FFF5ED", "H13": "#F5ECD2", "H14": "#CFD7D3", "H15": "#98A6A8", "H16": "#1D1414", "H17": "#F1EDED", "H18": "#FFFDF0", "H19": "#F6EFE2", "H20": "#949FA3", "H21": "#FFFBE1", "H22": "#CACAD4", "H23": "#9A9D94",
            "M1": "#BCC6B8", "M2": "#8AA386", "M3": "#697D80", "M4": "#E3D2BC", "M5": "#D0CCAA", "M6": "#B0A782", "M7": "#B4A497", "M8": "#B38281", "M9": "#A58767", "M10": "#C5B2BC", "M11": "#9F7594", "M12": "#644749", "M13": "#D19066", "M14": "#C77362", "M15": "#757D78"
        };

        // Cache luminance objects for text colors
        const colorsData = {};
        for (const [id, hex] of Object.entries(MARD_PALETTE)) {
            const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
            const yiq = ((r*299)+(g*587)+(b*114))/1000;
            colorsData[id] = { hex, textColor: (yiq >= 128) ? '#000000' : '#FFFFFF' };
        }

        let inventory = JSON.parse(localStorage.getItem('yuniPerlerInventory')) || {};
        let inventoryHistory = []; // Stack for undo functionality
        
        let patternColorsCache = { custom: {}, finished: {} };
        let selectedColorsForBatch = new Set();
        
        window.onload = function() {
            renderColorGrid();
            renderInventoryGrid();
            checkLowInventory();
        };

        // Push current state to history before modifying
        function pushHistory() {
            inventoryHistory.push(JSON.stringify(inventory));
            if(inventoryHistory.length > 50) inventoryHistory.shift(); // Keep last 50 actions
        }

        function saveInventory() {
            localStorage.setItem('yuniPerlerInventory', JSON.stringify(inventory));
            renderInventoryGrid();
            checkLowInventory();
        }

        window.undoAction = function() {
            if(inventoryHistory.length === 0) {
                showToast("没有可以撤回的操作啦 💦");
                return;
            }
            const previousState = inventoryHistory.pop();
            inventory = JSON.parse(previousState);
            saveInventory();
            
            // Re-render any active pattern requirements to reflect restored inventory
            if(!document.getElementById('result-custom').classList.contains('hidden')) renderPatternRequirements('custom');
            if(!document.getElementById('result-finished').classList.contains('hidden')) renderPatternRequirements('finished');
            
            showToast("成功撤回上一步操作！ ✨");
        };

        // UI Functions
        window.switchTab = function(tabId) {
            document.getElementById('tab-maker').classList.add('hidden');
            document.getElementById('tab-inventory').classList.add('hidden');
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            const makerBtn = document.getElementById('nav-maker');
            const invBtn = document.getElementById('nav-inventory');
            makerBtn.className = "nav-btn flex flex-col items-center p-2.5 transition-colors " + (tabId==='maker' ? "text-pink-500 active" : "text-pink-200 hover:text-pink-400");
            invBtn.className = "nav-btn flex flex-col items-center p-2.5 transition-colors " + (tabId==='inventory' ? "text-pink-500 active" : "text-pink-200 hover:text-pink-400");
        };

        window.updateFileName = function(type) {
            const input = document.getElementById(`imageInput-${type}`);
            const nameDisplay = document.getElementById(`fileName-${type}`);
            if (input.files && input.files.length > 0) {
                nameDisplay.textContent = input.files[0].name;
                nameDisplay.classList.replace('text-pink-300', 'text-pink-600');
                nameDisplay.classList.replace('text-purple-400', 'text-purple-700');
            }
        };

        // Custom Modals
        window.showModal = function(title, message, type = 'info', confirmCallback = null, withInput = false, initialInputValue = '') {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').innerHTML = message.replace(/\n/g, '<br>');
            
            const iconEl = document.getElementById('modalIcon');
            const actionsEl = document.getElementById('modalActions');
            const stickerEl = document.getElementById('modalSticker');
            const inputContainer = document.getElementById('modalInputContainer');
            const inputEl = document.getElementById('modalInput');

            stickerEl.textContent = type === 'warning' || type === 'error' ? '🍩' : (type === 'success' ? '🍰' : '🎀');
            
            if (type === 'warning' || type === 'error') {
                iconEl.className = 'mt-4 mb-3 inline-flex items-center justify-center w-14 h-14 rounded-full bg-red-100 border-4 border-white shadow-sm text-red-500';
                iconEl.innerHTML = '<i class="ph-fill ph-warning-circle text-2xl"></i>';
            } else if (type === 'success') {
                iconEl.className = 'mt-4 mb-3 inline-flex items-center justify-center w-14 h-14 rounded-full bg-green-100 border-4 border-white shadow-sm text-green-500';
                iconEl.innerHTML = '<i class="ph-fill ph-check-circle text-2xl"></i>';
            } else {
                iconEl.className = 'mt-4 mb-3 inline-flex items-center justify-center w-14 h-14 rounded-full bg-pink-100 border-4 border-white shadow-sm text-pink-500';
                iconEl.innerHTML = '<i class="ph-fill ph-cat text-2xl"></i>';
            }

            if (withInput) {
                inputContainer.classList.remove('hidden');
                inputEl.value = initialInputValue;
            } else {
                inputContainer.classList.add('hidden');
            }

            if (confirmCallback) {
                actionsEl.innerHTML = `
                    <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-500 font-black py-3 rounded-xl active:scale-[0.98] transition-all">取消</button>
                    <button id="modalConfirmBtn" class="flex-[2] bg-[#FFB6C1] text-white font-black py-3 rounded-xl active:scale-[0.98] transition-all shadow-md">确定</button>`;
                document.getElementById('modalConfirmBtn').onclick = () => { 
                    const val = withInput ? parseInt(inputEl.value) : null;
                    confirmCallback(val); 
                    closeModal(); 
                };
            } else {
                actionsEl.innerHTML = `<button onclick="closeModal()" class="w-full bg-[#FFB6C1] text-white font-black py-3 rounded-xl active:scale-[0.98] transition-all shadow-md">好哒！</button>`;
            }

            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            document.getElementById('modalContent').classList.remove('scale-95');
        };

        window.closeModal = function() {
            const modal = document.getElementById('customModal');
            modal.classList.add('opacity-0');
            document.getElementById('modalContent').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };
        
        window.showToast = function(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function renderColorGrid() {
            const grid = document.getElementById('addPaletteGrid');
            grid.innerHTML = '';
            
            const sortedIds = Object.keys(colorsData).sort((a, b) => {
                const regex = /([A-Z])(\d+)/; const matchA = a.match(regex); const matchB = b.match(regex);
                if (matchA[1] === matchB[1]) return parseInt(matchA[2]) - parseInt(matchB[2]);
                return matchA[1].localeCompare(matchB[1]);
            });

            sortedIds.forEach(id => {
                const c = colorsData[id];
                const div = document.createElement('div');
                div.className = `palette-item ${selectedColorsForBatch.has(id) ? 'selected' : ''}`;
                div.style.backgroundColor = c.hex;
                div.style.color = c.textColor;
                div.innerText = id;
                div.onclick = () => {
                    if (selectedColorsForBatch.has(id)) selectedColorsForBatch.delete(id);
                    else selectedColorsForBatch.add(id);
                    document.getElementById('selectedCountDisplay').textContent = `已选 ${selectedColorsForBatch.size} 色`;
                    renderColorGrid();
                };
                grid.appendChild(div);
            });
        }

        window.commitBatchAdd = function() {
            if (selectedColorsForBatch.size === 0) return showModal('忘了选颜色', '请先点击上方的色卡块选择你要入库的颜色哦~', 'warning');
            const count = parseInt(document.getElementById('batchCountInput').value);
            if (isNaN(count) || count <= 0) return showModal('数量不对', '请输入正确的统一入库数量~', 'warning');

            pushHistory(); // Save state for undo
            selectedColorsForBatch.forEach(id => { inventory[id] = (inventory[id] || 0) + count; });
            saveInventory();
            
            showToast(`成功入库 ${selectedColorsForBatch.size} 种颜色 ✨`);
            selectedColorsForBatch.clear();
            document.getElementById('selectedCountDisplay').textContent = '已选 0 色';
            document.getElementById('batchCountInput').value = '';
            renderColorGrid(); 
        };

        function renderInventoryGrid() {
            const grid = document.getElementById('inventoryMatrix');
            grid.innerHTML = '';
            const entries = Object.entries(inventory).filter(([_, count]) => count > 0);
            document.getElementById('totalColorsCount').textContent = `共 ${entries.length} 色`;

            if (entries.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-pink-300 font-bold text-sm">仓库空空如也，快去补货吧~</div>`;
                return;
            }

            entries.sort((a, b) => {
                const matchA = a[0].match(/([A-Z])(\d+)/); const matchB = b[0].match(/([A-Z])(\d+)/);
                if (!matchA || !matchB) return a[0].localeCompare(b[0]);
                if (matchA[1] === matchB[1]) return parseInt(matchA[2]) - parseInt(matchB[2]);
                return matchA[1].localeCompare(matchB[1]);
            }).forEach(([id, count]) => {
                const c = colorsData[id];
                if (!c) return;
                const card = document.createElement('div');
                card.className = 'inventory-card';
                card.onclick = () => {
                    showModal(`修改 [${id}] 库存`, '请输入新的数量，清空或设为 0 即删除', 'info', (newCount) => {
                        pushHistory();
                        if (newCount === null || isNaN(newCount) || newCount <= 0) delete inventory[id];
                        else inventory[id] = newCount;
                        saveInventory();
                        showToast("库存修改成功！");
                    }, true, count);
                };
                card.innerHTML = `<div class="inventory-card-top" style="background-color:${c.hex}; color:${c.textColor}">${id}</div><div class="inventory-card-bottom">${count} 颗</div>`;
                grid.appendChild(card);
            });
        }
        
        function checkLowInventory() {
            const lowGrid = document.getElementById('low-inventory-list');
            const alertBox = document.getElementById('low-inventory-alert');
            lowGrid.innerHTML = '';
            let hasLow = false;
            
            Object.entries(inventory).forEach(([id, count]) => {
                if(count > 0 && count < 200) {
                    hasLow = true;
                    const c = colorsData[id];
                    const card = document.createElement('div');
                    card.className = 'inventory-card border-red-200 shadow-sm';
                    card.innerHTML = `<div class="inventory-card-top" style="background-color:${c.hex}; color:${c.textColor}">${id}</div><div class="inventory-card-bottom bg-red-50 text-red-600 border-t-red-200">仅剩 ${count}</div>`;
                    lowGrid.appendChild(card);
                }
            });
            
            if(hasLow) {
                alertBox.classList.remove('hidden');
                alertBox.classList.add('block');
            } else {
                alertBox.classList.add('hidden');
                alertBox.classList.remove('block');
            }
        }

        function hexToRgbArr(hex) { return [parseInt(hex.slice(1,3), 16), parseInt(hex.slice(3,5), 16), parseInt(hex.slice(5,7), 16)]; }

        window.processImage = function(type) {
            const fileInput = document.getElementById(`imageInput-${type}`);
            const gridSelect = document.getElementById(`gridSize-${type}`);
            if (!fileInput.files || fileInput.files.length === 0) return showModal('需要图片', '请先上传一张想要制作的图片喵~', 'warning');

            showToast("正在努力计算中...");
            setTimeout(() => {
                const size = parseInt(gridSelect.value); 
                const img = new Image();
                const reader = new FileReader();

                reader.onload = function(e) {
                    img.onload = function() {
                        const tempCanvas = document.createElement('canvas');
                        const tempCtx = tempCanvas.getContext('2d');
                        const ratio = img.height / img.width;
                        const w = size, h = Math.round(size * ratio);
                        tempCanvas.width = w; tempCanvas.height = h; 
                        tempCtx.drawImage(img, 0, 0, w, h);
                        const data = tempCtx.getImageData(0, 0, w, h).data;
                        
                        let currentReqs = {};

                        // Calculate nearest colors
                        for (let i = 0; i < data.length; i += 4) {
                            if (data[i + 3] >= 128) {
                                let minDistance = Infinity, nearestId = "H1";
                                for (const [id, c] of Object.entries(colorsData)) {
                                    const cRgb = hexToRgbArr(c.hex);
                                    const distance = Math.pow(data[i] - cRgb[0], 2) + Math.pow(data[i+1] - cRgb[1], 2) + Math.pow(data[i+2] - cRgb[2], 2);
                                    if (distance < minDistance) { minDistance = distance; nearestId = id; }
                                }
                                currentReqs[nearestId] = (currentReqs[nearestId] || 0) + 1;
                            }
                        }
                        
                        patternColorsCache[type] = currentReqs;

                        // Only generate visual grid for 'custom' type
                        if(type === 'custom') {
                            const CELL = 24;
                            const mainCanvas = document.getElementById('hiddenCanvas');
                            mainCanvas.width = w * CELL; mainCanvas.height = h * CELL;
                            const ctx = mainCanvas.getContext('2d');
                            ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
                            ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

                            let pixelIndex = 0;
                            for (let i = 0; i < data.length; i += 4) {
                                let x = (pixelIndex % w) * CELL, y = Math.floor(pixelIndex / w) * CELL;
                                if (data[i + 3] >= 128) {
                                    // Recalculate to match cache (for simplicity in rendering loop)
                                    let minD = Infinity, nId = "H1";
                                    for (const [id, c] of Object.entries(colorsData)) {
                                        const cRgb = hexToRgbArr(c.hex);
                                        const d = Math.pow(data[i] - cRgb[0], 2) + Math.pow(data[i+1] - cRgb[1], 2) + Math.pow(data[i+2] - cRgb[2], 2);
                                        if (d < minD) { minD = d; nId = id; }
                                    }
                                    const nearest = colorsData[nId];
                                    ctx.fillStyle = nearest.hex; ctx.fillRect(x, y, CELL, CELL);
                                    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1; ctx.strokeRect(x, y, CELL, CELL);
                                    ctx.fillStyle = nearest.textColor; ctx.fillText(nId, x + CELL/2, y + CELL/2 + 1);
                                }
                                pixelIndex++;
                            }
                            const finalImageUrl = mainCanvas.toDataURL("image/jpeg", 0.9);
                            document.getElementById('previewImage-custom').src = finalImageUrl;
                            document.getElementById('viewerImage').src = finalImageUrl;
                        }

                        document.getElementById(`result-${type}`).classList.remove('hidden');
                        renderPatternRequirements(type);
                        setTimeout(() => { document.getElementById(`result-${type}`).scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 150);
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(fileInput.files[0]);
            }, 50);
        };

        window.renderPatternRequirements = function(type) {
            const list = document.getElementById(`req-list-${type}`);
            list.innerHTML = '';
            const reqs = patternColorsCache[type];
            const sorted = Object.entries(reqs).sort((a, b) => b[1] - a[1]);
            
            sorted.forEach(([id, count]) => {
                const stock = inventory[id] || 0;
                const isShort = stock < count;
                const c = colorsData[id];
                
                const card = document.createElement('div');
                card.className = 'inventory-card';
                card.innerHTML = `<div class="inventory-card-top" style="background-color:${c.hex}; color:${c.textColor}">${id}</div>
                    <div class="inventory-card-bottom flex flex-col items-center">
                        <span>x ${count}</span>
                        ${isShort ? `<span class="text-[9px] text-red-500 bg-red-100 px-1 rounded mt-0.5">缺 ${count - stock}</span>` : ''}
                    </div>`;
                list.appendChild(card);
            });
        }

        window.deductFromInventory = function(type) {
            const reqs = patternColorsCache[type];
            if (Object.keys(reqs).length === 0) return;

            let hasShortage = false; let shortageList = [];
            for (const id in reqs) {
                if ((inventory[id] || 0) < reqs[id]) {
                    hasShortage = true; shortageList.push(`[${id}] 缺 ${reqs[id] - (inventory[id] || 0)}颗`);
                }
            }

            if (hasShortage) {
                return showModal('库存告急 🚨', `以下颜色的豆豆不够啦，无法扣除：\n\n${shortageList.join('\n')}\n\n请先去“仓库”补充库存哦！`, 'error');
            }

            showModal('确认完成 🧁', '确定要从仓库扣除这些豆豆吗？', 'info', () => {
                pushHistory(); // Save state for undo before deduction
                for (const id in reqs) inventory[id] -= reqs[id];
                saveInventory();
                renderPatternRequirements(type); // Re-render to show updated stock status
                showToast('太棒了，库存已成功扣除！ 🍰');
            });
        };

        window.openViewer = function() {
            const viewer = document.getElementById('imageViewer');
            viewer.classList.remove('hidden'); viewer.style.display = 'flex';
            setTimeout(() => viewer.classList.remove('opacity-0'), 10);
        };
        window.closeViewer = function() {
            const viewer = document.getElementById('imageViewer');
            viewer.classList.add('opacity-0');
            setTimeout(() => { viewer.classList.add('hidden'); viewer.style.display = 'none'; }, 300);
        };
    </script>
</body>
</html>
